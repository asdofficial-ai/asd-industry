name: ASD Industry Demo Checks
on:
  push:
    branches:
      - main
      - feature/step2-builder-profiles
  pull_request:
    branches:
      - main
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
