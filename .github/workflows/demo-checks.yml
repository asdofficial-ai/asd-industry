name: ASD Industry Demo Checks
on:
  push:
    branches:
      - main
      - feature/step2-builder-profiles
  pull_request:
    branches:
      - main
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check responsive layout and overlap
        run: node tests/mobile-layout.e2e.cjs
      - name: Test account shell and separated profile flow
        run: node tests/profile-flows.e2e.cjs
      - name: Test scrollable project browse, filters and saved interests
        run: node tests/project-board.e2e.cjs
      - name: Test creator approval, role assignment and squad management
        run: node tests/manager-dashboard.e2e.cjs
